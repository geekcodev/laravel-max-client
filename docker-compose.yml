services:

  app:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        INSTALL_XDEBUG: "true"
    user: 1000:1000
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Moscow
      - XDEBUG_MODE=coverage
      - MAX_API_TOKEN=${MAX_API_TOKEN:-}
      - MAX_WEBHOOK_SECRET=${MAX_WEBHOOK_SECRET:-}
      - MAX_BASE_URI=${MAX_BASE_URI:-https://platform-api2.max.ru}
